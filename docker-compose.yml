services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: didemo-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DiDemo_Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DiDemo_Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
